[project]
name = "cvcops"
version = "0.0.1"
description = "OpenCV perception for Houdini 22 Copernicus (working title). The engine never imports hou."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    # Exactly one OpenCV wheel: they all provide cv2 and overwrite each other (FACTS C10).
    "opencv-contrib-python-headless==5.0.0.93",
    # OpenCV 5 wheels have no EXR support (FACTS C7).
    "OpenEXR>=3.3",
]

[project.scripts]
cvcops = "cvcops.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23"]
# The evolve lane only (mission ME): `uv sync --group evolve`. A plain `uv sync` removes it again.
evolve = ["openevolve==0.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvcops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"

# The one place names live (decision 0002). The asset builder reads hda_namespace, the package installer reads
# package, and tests/thresholds/test_guards.py checks these agree with src/cvcops/capabilities.json.
[tool.cvcops.names]
package = "cvcops"
command = "cvcops"
hda_namespace = "cvcops"
hda_flow = "flow"
env_prefix = "CVCOPS"
